name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_practice_test
        ports:
          - 5432:5432
        # Đợi Postgres thật sự sẵn sàng nhận connection trước khi job tiếp tục
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: nestjs_practice_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TLS: 'false'
      JWT_ACCESS_SECRET: ci_test_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci_test_secret
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit test
        run: npm run test

      # Không có .env.test trên CI runner (gitignore), migration runner
      # (src/database/migration.runner.ts) fallback dùng biến env ở trên
      # khi không tìm thấy file .env.test.
      - name: Run migrations (trên DB test vừa spin lên)
        run: npm run migration:run

      - name: E2E test
        run: npm run test:e2e
